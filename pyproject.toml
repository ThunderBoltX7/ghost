[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ghost-cli"
version = "3.0.0"
description = "Ghost — Elite autonomous AI coding assistant CLI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "ThunderBoltX7" }]
keywords = ["ai", "cli", "coding-assistant", "agent", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

dependencies = [
    "openai>=1.30.0",
    "rich>=13.7.0",
    "prompt_toolkit>=3.0.43",
]

[project.optional-dependencies]
fast = ["tiktoken>=0.7.0"]
dev  = ["pytest>=8.0", "pytest-cov", "ruff", "mypy"]

[project.urls]
Homepage   = "https://github.com/ThunderBoltX7/ghost"
Repository = "https://github.com/ThunderBoltX7/ghost"
Issues     = "https://github.com/ThunderBoltX7/ghost/issues"

[project.scripts]
ghost = "ghost_cli.main:main"

[tool.setuptools.packages.find]
where   = ["."]
include = ["ghost_cli*"]

[tool.setuptools.package-data]
ghost_cli = ["py.typed"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --tb=short"
